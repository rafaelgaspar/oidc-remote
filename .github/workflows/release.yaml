name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Plain version tags (no "v") plus latest: k3s-home tracks this image
      # with a Flux ImagePolicy over the semver tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rafaelgaspar/oidc-remote
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=oidc-remote
            org.opencontainers.image.description=MCP stdio and HTTP proxy: OAuth2 client_credentials + K8s SA JWT assertion
            org.opencontainers.image.source=https://github.com/rafaelgaspar/oidc-remote
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC Trusted Publishing — no NPM_TOKEN
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      # OIDC Trusted Publishing needs npm CLI >=11.5.1; don't rely on whatever
      # version node-version:24 happens to bundle.
      - run: npm install -g npm@12.0.2

      # Trusted Publisher (org rafaelgaspar, repo oidc-remote, workflow
      # release.yaml) may npm publish. The dist-tag is set at publish time.
      - name: Dist-tag
        id: dist
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public --tag ${{ steps.dist.outputs.tag }}

  github-release:
    name: Create GitHub Release
    needs: [docker, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
