name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Build image & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: ghcr.io/rafaelgaspar/oidc-remote:sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Never pushed — the registry build happens in release.yaml on tag push.
      - name: Build image (multi-arch, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -u
          [ "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 1000 ]
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -L "$(command -v oidc-remote)"'
          check() {
            want="$1"; shift
            set +e; out=$(docker run --rm "$IMAGE" "$@" 2>&1); rc=$?; set -e
            echo "oidc-remote $* -> exit $rc: $out"
            [ "$rc" -eq 1 ] && grep -qF -- "$want" <<<"$out"
          }
          check "usage: oidc-remote"
          check "--gateway is required" stdio
          check "--gateway is required" proxy

      # Same scope as longhorn-mcp: vuln only, actionable HIGH/CRITICAL.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
